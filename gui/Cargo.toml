[package]
name = "cswap-gui"
version = "0.1.0"
edition = "2021"
description = "Desktop dashboard for claude-swap: see every account's usage and switch with one click"
license = "MIT"

[dependencies]
eframe = "0.36"
egui = "0.36"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"

[profile.release]
opt-level = 3
lto = true
strip = true
